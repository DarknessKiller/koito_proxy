name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  docker-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath -ldflags="-s -w" -o koito_proxy_linux_amd64 ./cmd/app
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags embed -trimpath -ldflags="-s -w" -o koito_proxy_linux_arm64 ./cmd/app
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags embed -trimpath -ldflags="-s -w" -o koito_proxy_darwin_amd64 ./cmd/app
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags embed -trimpath -ldflags="-s -w" -o koito_proxy_darwin_arm64 ./cmd/app

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            koito_proxy_linux_amd64
            koito_proxy_linux_arm64
            koito_proxy_darwin_amd64
            koito_proxy_darwin_arm64
