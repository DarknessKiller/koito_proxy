name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          set -eux

          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags="-s -w" \
                -o koito_proxy_${os}_${arch} ./cmd/app
            done
          done

      - name: Package artifacts
        run: |
          set -eux
          VERSION=${{ steps.version.outputs.VERSION }}

          mkdir -p dist

          package () {
            os=$1
            arch=$2

            mkdir pkg
            cp koito_proxy_${os}_${arch} pkg/koito_proxy
            chmod +x pkg/koito_proxy

            tar -C pkg -czf dist/koito_proxy_${VERSION}_${os}_${arch}.tar.gz koito_proxy
            rm -rf pkg
          }

          package linux amd64
          package linux arm64
          package darwin amd64
          package darwin arm64

          cd dist
          sha256sum *.tar.gz > koito_proxy_${VERSION}_checksums.txt

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo
        id: repo
        run: echo "LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.LOWERCASE }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.repo.outputs.LOWERCASE }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*_checksums.txt
